name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Wrangle drives Safari through Apple Events, and every test runs against a fake bridge that
    # speaks that protocol. macOS is where it has to be green, because macOS is the only place it
    # runs at all.
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor the gemspec claims, and the current release. A claim nobody tests is a guess.
        ruby: ["3.2", "3.4"]

    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      # Coverage is measured, and enforced, by Ruby's own Coverage module — no gem, because adding a
      # dependency to check that Wrangle has none would be a strange way to keep the claim. The floor
      # is on branches as well as lines: lines alone say almost nothing about a codebase whose whole
      # job is refusing things. One arm is a genuine race between two correct outcomes, so the floor
      # sits just under where the suite actually lands rather than pinning it to the good day.
      - run: COVERAGE=1 COVERAGE_ENFORCE=1 COVERAGE_FLOOR=95 bundle exec rake test

      # The injected JavaScript is worth a syntax check of its own: a typo in it fails inside Safari,
      # where the error surfaces a long way from the cause.
      - run: bundle exec rake jscheck

  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      # RuboCop is deliberately absent from the Gemfile: it needs a native json build, and a
      # checkout should not require a compiler. CI has one, so the lint runs here instead. Pinned,
      # because `NewCops: enable` means an upgrade can fail a build that changed nothing.
      - run: gem install rubocop -v 1.89.0 --no-document
      - run: rubocop
