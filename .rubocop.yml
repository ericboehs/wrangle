AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false

# Wrangle uses double quotes throughout, and prose-length comments explaining why a refusal exists.
Style/StringLiterals:
  EnforcedStyle: double_quotes
Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes
Style/Documentation:
  Enabled: false

Layout/LineLength:
  Max: 120

# The bridge and session methods are state machines. Splitting one to satisfy a line count would
# scatter a refusal and the reason for it across methods, which is exactly what this code must not do.
Metrics/MethodLength:
  Max: 30
Metrics/AbcSize:
  Max: 30
  Exclude:
    - "test/**/*.rb"
    # The CLI's argument parser and step formatter are wide by nature: one branch per flag, one
    # column per field. Breaking them up would hide the shape of the interface, not clarify it.
    - "exe/wrangle"
Metrics/CyclomaticComplexity:
  Max: 15
  Exclude:
    - "exe/wrangle"
Metrics/PerceivedComplexity:
  Max: 15
# SessionServer is the socket protocol plus the small surface the run loop is allowed to ask for.
# The decision loop itself now lives in RunLoop; this was raised twice before that split and should
# be lowered, not raised, from here.
Metrics/ClassLength:
  Max: 300
  Exclude:
    - "test/**/*.rb"
Metrics/BlockLength:
  Exclude:
    - "test/**/*.rb"
    - "*.gemspec"
Metrics/ParameterLists:
  Max: 9

# `op` is the protocol's own word for a bridge or page operation; a longer name would be a lie.
Naming/MethodParameterName:
  AllowedNames: ["op", "io", "id", "to", "x", "y", "w", "h"]

# The CLI formats fixed columns; annotated tokens would only make the format strings harder to read.
Style/FormatStringToken:
  Exclude:
    - "exe/wrangle"

# The CLI is one dispatch surface. Splitting it into modules to satisfy a line count would scatter a
# command, its output format, and its exit code across files, which is worse for a reader chasing one.
Metrics/ModuleLength:
  Exclude:
    - "exe/wrangle"
